name: Build Proton ARM64EC

# Jalan manual saja: tab Actions -> Run workflow.
on:
  workflow_dispatch:

# Perlu buat menerbitkan hasil build sebagai Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # batas keras GitHub 360 menit; berhenti rapi sebelum itu
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Bebaskan ruang disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h /

      - name: Siapkan /content + build.sh (JOBS naik ke 4)
        run: |
          sudo mkdir -p /content
          sudo chown "$USER:$USER" /content
          cp build_proton_arm64ec_colab_v2.sh build.sh
          sed -i 's/^JOBS=3/JOBS=4/' build.sh
          grep -n '^JOBS=' build.sh

      # Cache 1 — HASIL JADI: zip final disimpan apa adanya.
      # Kuncinya = isi script build. Selama script TIDAK berubah, run
      # berikutnya mengambil zip ini dan langsung lompat ke Release
      # (build dilewati total, selesai dalam hitungan menit) — persis
      # untuk kasus seperti run #3: build sukses, cuma langkah
      # Release-nya yang gagal, tidak perlu compile ulang 24 menit.
      # Kalau script berubah, kunci berubah -> cache kosong -> build
      # penuh, lalu zip baru disimpan dengan kunci baru.
      - name: Cache hasil jadi (zip final)
        id: cache-hasil
        uses: actions/cache@v4
        with:
          path: /content/Proton-ARM64EC-Custom-Ubuntu.zip
          key: proton-hasil-${{ hashFiles('build_proton_arm64ec_colab_v2.sh') }}

      # Cache 2 — SUMBER & UNDUHAN MAHAL: dipakai hanya bila build
      # memang jalan. Script sudah punya penjaga "sudah ada, lewati"
      # untuk tarball toolchain, clone wine-src, fex-src dan box64-src,
      # jadi yang dipulihkan di sini tidak diunduh/diclone ulang.
      # Stamp SENGAJA tidak ikut disimpan: fase tetap jalan dan
      # memeriksa isinya sendiri, jadi tidak ada fase yang keliru
      # terlewat karena stamp-nya ada tapi isinya tidak.
      - name: Cache sumber (toolchain, source, sysroot, deb)
        if: steps.cache-hasil.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /content/toolchain
            /content/sysroot-arm64
            /content/build-proton-arm64ec/llvm-mingw.tar.xz
            /content/build-proton-arm64ec/wine-src
            /content/build-proton-arm64ec/fex-src
            /content/build-proton-arm64ec/box64-src
            /content/build-proton-arm64ec/apt-cache
          key: proton-sumber-${{ hashFiles('build_proton_arm64ec_colab_v2.sh') }}
          restore-keys: |
            proton-sumber-

      - name: Build semua fase
        if: steps.cache-hasil.outputs.cache-hit != 'true'
        run: bash build.sh all

      - name: Terbitkan hasil sebagai Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh /content/*.zip
          gh release create "build-${{ github.run_number }}" \
            /content/Proton-ARM64EC-Custom-Ubuntu.zip \
            --title "Proton ARM64EC build #${{ github.run_number }}" \
            --notes "Hasil build otomatis GitHub Actions (script v2, JOBS=4)."
